name: Altin fiyat bildirimi

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir (GitHub birkaç dk gecikebilir)
  workflow_dispatch:          # elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiyati kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_alert.py

      - name: Son fiyati kaydet
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state guncelle" && git push)

name: Altin fiyat bildirimi

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dk kontrol; ne zaman mesaj atılacağına script karar verir
  workflow_dispatch:          # elle çalıştırma butonu
    inputs:
      test:
        description: "Saatten bağımsız hemen mesaj gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiyati kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_PCT: ${{ vars.ALERT_PCT }}
          FORCE_SEND: ${{ inputs.test }}
        run: python gold_alert.py

      - name: Durumu kaydet
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state guncelle" && git push)
